on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "**"
      - "!**/*.md"
      - "!.github/dependabot.yml"
      - "!.github/workflows/**"
      - ".github/workflows/test.yml"
  pull_request:
    paths:
      - "**"
      - "!**/*.md"
      - "!.github/dependabot.yml"
      - "!.github/workflows/**"
      - ".github/workflows/test.yml"
name: Test

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  Tests:
    strategy:
      matrix:
        go-version: [1.26.x, 1.27.x]
        platform: [blacksmith-4vcpu-ubuntu-2404, blacksmith-4vcpu-windows-2025]
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 30
    steps:
    - name: Fetch Repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Install Go
      uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
      with:
        go-version: ${{ matrix.go-version }}
        check-latest: true
    - name: Run Test
      run: go test ./... -v -race
